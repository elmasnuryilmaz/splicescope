name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # A floor, not a target: it sits well under the 98 % the suite reaches, so it
        # fires on a feature landing untested rather than on ordinary movement.
        run: pytest -q --cov=splicescope --cov-report=term-missing --cov-fail-under=90

      - name: Smoke-test the CLI
        run: |
          splicescope simulate --outdir demo_data --genes 6
          splicescope run --sj-dir demo_data/sj --gtf demo_data/annotation.gtf \
            --groups demo_data/groups.tsv --genome demo_data/genome.fa \
            --outdir results
          test -f results/differential_splicing.tsv
          test -f results/events.tsv
          # the consequence layer must run on the built-in data, with no downloads
          test -f results/consequence.tsv
          test -f results/junction_consequence.tsv

  oldest:
    # pyproject declares a floor for every dependency, and the matrix above resolves to
    # the newest of everything, so nothing checked that the floor was real. This installs
    # exactly it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # requires-python's own floor
          cache: pip

      - name: Install the oldest supported dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints-oldest.txt

      - name: Show what resolved
        run: python -c "import numpy, pandas, scipy, sklearn, matplotlib; print(numpy.__version__, pandas.__version__, scipy.__version__, sklearn.__version__, matplotlib.__version__)"

      - name: Test
        run: pytest -q

  dashboard:
    # The README's first badge is a live Streamlit demo, so a broken dashboard is the
    # most visible failure this repository has. Streamlit's headless harness renders the
    # real page here; the analysis behind it is covered by the main suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with the dashboard extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"

      - name: Render the dashboard
        run: pytest tests/test_dashboard.py -q

  nextflow:
    # The pipeline's real-data branch was broken from the day it was written until
    # 0.9.0, because nothing ever ran it. Both branches are exercised here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - uses: nf-core/setup-nextflow@v2

      - name: Demo mode
        run: |
          nextflow run nextflow/main.nf -profile test
          test -f results/out/differential_splicing.tsv
          # the simulator writes a genome, so demo mode reaches the consequence layer
          test -f results/out/consequence.tsv
          test -f results/out/junction_consequence.tsv

      - name: Real-data mode, with the inputs staged apart as a real dataset has them
        run: |
          splicescope simulate --outdir staging --genes 8
          mkdir -p inputs
          mv staging/sj inputs/star_junctions
          mv staging/annotation.gtf inputs/gencode.gtf
          mv staging/groups.tsv inputs/design.tsv
          mv staging/genome.fa inputs/GRCh38.fa
          mv staging/genome.fa.fai inputs/GRCh38.fa.fai
          nextflow run nextflow/main.nf --outdir real_results \
            --sj_dir "$PWD/inputs/star_junctions" \
            --gtf "$PWD/inputs/gencode.gtf" \
            --groups "$PWD/inputs/design.tsv" \
            --genome "$PWD/inputs/GRCh38.fa"
          test -f real_results/out/differential_splicing.tsv
          test -f real_results/out/junction_consequence.tsv

      - name: Real-data mode without a genome skips the consequence layer
        run: |
          nextflow run nextflow/main.nf --outdir bare_results \
            --sj_dir "$PWD/inputs/star_junctions" \
            --gtf "$PWD/inputs/gencode.gtf" \
            --groups "$PWD/inputs/design.tsv"
          test -f bare_results/out/events.tsv
          test ! -f bare_results/out/consequence.tsv
