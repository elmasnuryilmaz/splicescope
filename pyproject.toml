[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splicescope"
dynamic = ["version"]
description = "Detect, quantify and characterize alternative and cryptic splicing events from splice junctions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elmasnur Yılmaz", email = "elmasnrylmz@gmail.com" }]
keywords = ["bioinformatics", "RNA-seq", "alternative-splicing", "cryptic-exons", "transcriptomics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "matplotlib>=3.6",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
app = ["streamlit>=1.28"]
# hypothesis is not optional here: tests/test_properties.py imports it at module
# level, so without it the whole module fails to collect and the suite is red.
dev = ["pytest>=7", "ruff>=0.1", "pytest-cov>=4", "hypothesis>=6.80"]
# Rebuilding the executed tutorial and the figures in docs/. Separate from `dev` because
# the test suite does not need a Jupyter kernel, and separate from nothing at all, which
# is what these were before: the notebook is advertised as reproducible, so the tools
# that reproduce it have to be installable.
docs = ["nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.25", "pillow>=10"]

[project.scripts]
splicescope = "splicescope.cli:main"

[project.urls]
Homepage = "https://elmasnuryilmaz.github.io"
Repository = "https://github.com/elmasnuryilmaz/splicescope"
Issues = "https://github.com/elmasnuryilmaz/splicescope/issues"
Changelog = "https://github.com/elmasnuryilmaz/splicescope/blob/main/CHANGELOG.md"
Documentation = "https://github.com/elmasnuryilmaz/splicescope/blob/main/docs/METHODS.md"
Archive = "https://doi.org/10.5281/zenodo.22287002"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: without this marker in the wheel, a type checker in someone else's project
# ignores every annotation in this package. Sixty of its sixty-five public functions
# carry them.
[tool.setuptools.package-data]
splicescope = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "splicescope.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# the Streamlit app inserts ../src into sys.path before importing the package
"app/streamlit_app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unmutated_source: reads the source of this package and assumes nobody has edited it. The mutation survey deselects these, because it edits the source on purpose and would otherwise see them fail on every mutation and call each one caught.",
]
