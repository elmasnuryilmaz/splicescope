name: Mutation survey

# Each mutation runs the whole suite, so this is far too slow for every push. It runs
# weekly and on request instead. A "surprise" is a defect the suite failed to notice,
# or one of the two documented equivalent mutants suddenly being caught.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Break the code 83 ways and check the suite notices
        run: python validation/mutation_survey.py
