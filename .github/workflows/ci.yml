name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `docs` too: the suite checks that the committed tutorial is the one the
          # builder produces, which means importing the builder, which needs nbformat.
          # Without it that test fails here and passes on any machine that has ever
          # rebuilt the notebook.
          pip install -e ".[dev,docs]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # A floor, not a target: it sits well under the 98 % the suite reaches, so it
        # fires on a feature landing untested rather than on ordinary movement.
        run: pytest -q --cov=splicescope --cov-report=term-missing --cov-fail-under=90

      - name: Smoke-test the CLI
        run: |
          splicescope simulate --outdir demo_data --genes 6
          splicescope run --sj-dir demo_data/sj --gtf demo_data/annotation.gtf \
            --groups demo_data/groups.tsv --genome demo_data/genome.fa \
            --outdir results
          test -f results/differential_splicing.tsv
          test -f results/events.tsv
          # the consequence layer must run on the built-in data, with no downloads
          test -f results/consequence.tsv
          test -f results/junction_consequence.tsv

  oldest:
    # pyproject declares a floor for every dependency, and the matrix above resolves to
    # the newest of everything, so nothing checked that the floor was real. This installs
    # exactly it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # requires-python's own floor
          cache: pip

      - name: Install the oldest supported dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]" -c constraints-oldest.txt

      - name: Show what resolved
        run: python -c "import numpy, pandas, scipy, sklearn, matplotlib; print(numpy.__version__, pandas.__version__, scipy.__version__, sklearn.__version__, matplotlib.__version__)"

      - name: Test
        run: pytest -q

  dashboard:
    # The README's first badge is a live Streamlit demo, so a broken dashboard is the
    # most visible failure this repository has. Streamlit's headless harness renders the
    # real page here; the analysis behind it is covered by the main suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with the dashboard extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"

      - name: Render the dashboard
        run: pytest tests/test_dashboard.py -q

  tutorial:
    # The suite checks that the committed notebook is the one its builder produces, but
    # by comparing the cells rather than what running them prints. A change to the
    # analysis therefore leaves the committed numbers stale with nothing to notice — the
    # notebook reported 43 significant junctions for a while where the code found 46.
    # This executes it and compares the printed output, which unlike the embedded figures
    # does not depend on the platform's font rendering.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with the notebook tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"
          python -m ipykernel install --user --name splicescope-venv

      - name: The committed tutorial must print what the code prints
        run: python examples/_build_tutorial.py --check

  nextflow:
    # The pipeline's real-data branch was broken from the day it was written until
    # 0.9.0, because nothing ever ran it. Both branches are exercised here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - uses: nf-core/setup-nextflow@v2

      - name: Demo mode
        run: |
          nextflow run nextflow/main.nf -profile test
          test -f results/out/differential_splicing.tsv
          # the report and timeline are provenance, so they belong beside the results.
          # They were written to null/ from 0.1.0 onwards because params.outdir had no
          # default at the point nextflow.config interpolates it, and nothing looked.
          test -f results/pipeline_report.html
          test -f results/pipeline_timeline.html
          test ! -d null
          # the simulator writes a genome, so demo mode reaches the consequence layer
          test -f results/out/consequence.tsv
          test -f results/out/junction_consequence.tsv

      - name: Real-data mode, with the inputs staged apart as a real dataset has them
        run: |
          splicescope simulate --outdir staging --genes 8
          mkdir -p inputs
          mv staging/sj inputs/star_junctions
          mv staging/annotation.gtf inputs/gencode.gtf
          mv staging/groups.tsv inputs/design.tsv
          mv staging/genome.fa inputs/GRCh38.fa
          mv staging/genome.fa.fai inputs/GRCh38.fa.fai
          nextflow run nextflow/main.nf --outdir real_results \
            --sj_dir "$PWD/inputs/star_junctions" \
            --gtf "$PWD/inputs/gencode.gtf" \
            --groups "$PWD/inputs/design.tsv" \
            --genome "$PWD/inputs/GRCh38.fa"
          test -f real_results/out/differential_splicing.tsv
          test -f real_results/out/junction_consequence.tsv

      - name: Real-data mode without a genome skips the consequence layer
        run: |
          nextflow run nextflow/main.nf --outdir bare_results \
            --sj_dir "$PWD/inputs/star_junctions" \
            --gtf "$PWD/inputs/gencode.gtf" \
            --groups "$PWD/inputs/design.tsv"
          test -f bare_results/out/events.tsv
          test ! -f bare_results/out/consequence.tsv

  nextflow-profiles:
    # The `docker` and `conda` profiles are how someone without a Python environment of
    # their own runs the pipeline, and the job above never touches them: its three runs are
    # profile-less, against `pip install -e .`. Every fault those profiles have had (an
    # image with Python but no splicescope, a beforeScript that installed on the host, an
    # image without the `ps` that Nextflow needs) shows only inside the container or env.
    #
    # Both profiles install the release named by manifest.version from PyPI. Run as they
    # are, they would test the last release rather than this change, and they would fail
    # on the pull request that raises the version, since PyPI has nothing under it until
    # the tag is pushed. So each installs a wheel of this checkout instead, through the
    # profile's own route: --splicescope_wheel for docker, the profile's environment file
    # with its pin swapped for the wheel for conda. That the pin equals __version__ is the
    # test suite's job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # the docker image's and the conda environment's Python, so the comparison at
          # the end is like for like
          python-version: "3.11"
          cache: pip

      - name: Build a wheel of this checkout, without installing it here
        # splicescope stays off this machine until the reference run, so a profile run
        # that used the host's copy, or installed into it, cannot pass unnoticed
        run: |
          python -m pip install --upgrade pip
          pip wheel --no-deps --wheel-dir dist .
          echo "WHEEL=$PWD/$(ls dist/splicescope-*.whl)" >> "$GITHUB_ENV"

      - uses: nf-core/setup-nextflow@v2

      - name: Install Miniforge
        run: |
          curl -fsSL -o "$RUNNER_TEMP/miniforge.sh" \
            https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
          bash "$RUNNER_TEMP/miniforge.sh" -b -p "$RUNNER_TEMP/miniforge"
          echo "$RUNNER_TEMP/miniforge/condabin" >> "$GITHUB_PATH"

      - name: Demo mode with the docker profile
        run: |
          nextflow run nextflow/main.nf -profile test,docker --splicescope_wheel "$WHEEL"
          test -f results/out/differential_splicing.tsv
          test -f results/out/junction_consequence.tsv
          test -f results/pipeline_report.html
          test -f results/pipeline_timeline.html
          test ! -d null
          # both processes ran in the profile's image and installed the wheel there
          nextflow log last -f name,container,workdir | tee tasks.tsv
          test "$(wc -l < tasks.tsv)" -eq 2
          test "$(cut -f2 tasks.tsv | sort -u)" = \
            "$(nextflow config nextflow -profile docker -value process.container)"
          for dir in $(cut -f3 tasks.tsv); do
            grep -qF "./$(basename "$WHEEL")" "$dir/.command.sh"
          done

      - name: Demo mode with the conda profile
        run: |
          sed "s|splicescope==.*|$WHEEL|" nextflow/environment.yml > ci-environment.yml
          # the release pin has to be gone, or this would quietly test the release
          if grep -q "splicescope==" ci-environment.yml; then exit 1; fi
          grep -qF "$WHEEL" ci-environment.yml
          nextflow run nextflow/main.nf -profile test,conda \
            -with-conda "$PWD/ci-environment.yml" --outdir conda_results
          test -f conda_results/out/differential_splicing.tsv
          test -f conda_results/out/junction_consequence.tsv
          test -f conda_results/pipeline_report.html
          # the environment Nextflow built holds the wheel, not a download from PyPI
          env=$(ls -d work/conda/env-*)
          "$env/bin/python" -c "import importlib.metadata as m; print(m.distribution('splicescope').read_text('direct_url.json'))" \
            | grep -F "$(basename "$WHEEL")"

      - name: Neither profile used or changed this machine's Python
        run: |
          if python -c "import splicescope" 2>/dev/null || command -v splicescope; then
            echo "::error::splicescope is installed on the runner itself"
            exit 1
          fi

      - name: Demo mode without a profile, as the reference
        run: |
          pip install -e .
          nextflow run nextflow/main.nf -profile test --outdir host_results

      - name: The docker and conda runs write the reference's tables
        # same seed, same code, same Python minor version; the tolerance only absorbs a
        # dependency release landing between the three installs
        shell: python
        run: |
          from pathlib import Path

          import pandas as pd

          reference = Path("host_results/out")
          tables = sorted(p.name for p in reference.glob("*.tsv"))
          assert "differential_splicing.tsv" in tables, tables
          for run in ("results", "conda_results"):
              out = Path(run) / "out"
              assert sorted(p.name for p in out.glob("*.tsv")) == tables, f"{run} differs"
              for name in tables:
                  ref = pd.read_csv(reference / name, sep="\t")
                  got = pd.read_csv(out / name, sep="\t")
                  pd.testing.assert_frame_equal(got, ref, check_exact=False, rtol=1e-6)
                  how = "identical" if got.equals(ref) else "equal within rtol 1e-6"
                  print(f"{run}/out/{name}: {len(ref)} rows, {how}")
